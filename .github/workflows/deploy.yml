name: Deploy The Thinking Behind to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'favicon.svg', 'LICENSE', 'scoreboard/**', 'build.mjs', 'build.test.mjs', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Publish only the static app and scoreboard. Never copy private lists.
      - name: Prepare public site
        run: |
          npm ci
          npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

name: Deploy The Thinking Behind to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'LICENSE', 'scoreboard/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publish only the static app and scoreboard. Never copy private lists.
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html app.js styles.css LICENSE _site/
          cp -R scoreboard _site/scoreboard
          printf '%s\n' 'window.TTB_SEALED = {"classic":[],"arcade":[]};' > _site/sealed.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Thinking Behind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wall">
      <div class="bars" id="bars" aria-hidden="true"></div>
      <p class="empty" id="empty" hidden></p>
      <footer class="strip">
        <p class="count" id="count" aria-live="polite"></p>
        <button class="act" id="draw" type="button"><kbd>Space</kbd>Open a file</button>
      </footer>
    </main>

    <section class="sheet" id="sheet" aria-live="polite" hidden>
      <p class="thing" id="thing"></p>
      <div class="question-box" id="questionBox"><h1 class="question" id="question"></h1></div>
      <ol class="sources" id="sources" hidden></ol>
      <footer class="band" id="band">
        <p class="status" id="status"></p>
        <div class="acts" id="acts"></div>
      </footer>
    </section>

    <p class="toast" id="toast" role="status" hidden></p>

    <script src="sealed.js"></script>
    <script src="app.js"></script>
  </body>
</html>
